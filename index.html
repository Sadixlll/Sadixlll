<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sadixll Project</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: white; font-family: sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }

<body class="flex items-center justify-center min-h-screen">
    <div class="glass p-10 rounded-3xl shadow-2xl text-center max-w-lg">

        <p class="text-gray-400 mb-6 text-lg">Добро пожаловать на мой новый сайт. Здесь будет музыка, моды и крутой контент.</p>
        <button class="bg-blue-600 hover:bg-blue-700 px-8 py-3 rounded-full font-bold transition-all transform hover:scale-105">
            Подписаться
        </button>
    </div>
</body>
</html>
